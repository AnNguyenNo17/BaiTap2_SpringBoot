<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ</title>
</head>
<body>
    <h1 class="mb-4">10 sản phẩm mới nhất</h1>

    <div th:if="${#lists.isEmpty(topProducts)}" class="alert alert-warning">
        Hiện chưa có sản phẩm nào trong CSDL.
    </div>

    <div class="row row-cols-1 row-cols-md-4 g-3" th:if="${not #lists.isEmpty(topProducts)}">
        <div class="col" th:each="p : ${topProducts}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}">Tên sản phẩm</h5>
                    <p class="card-text">Giá: <strong th:text="${p.price}">0</strong> VNĐ</p>
                    <a th:href="@{/product/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-4">
    <a href="/product" class="btn btn-link">Xem tất cả sản phẩm (phân trang 6 sp/trang)</a>
</body>
</html>
