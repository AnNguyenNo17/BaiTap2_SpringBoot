<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm</title>
</head>
<body>
    <h1 class="mb-4">Danh sách sản phẩm (6 sp / trang)</h1>

    <div th:if="${productPage == null or productPage.totalElements == 0}" class="alert alert-warning">
        Hiện chưa có sản phẩm nào.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-3" th:if="${productPage != null and productPage.totalElements > 0}">
        <div class="col" th:each="p : ${productPage.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}">Tên sản phẩm</h5>
                    <p class="card-text">
                        Giá: <strong th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')}">0</strong> VNĐ
                    </p>
                    <a th:href="@{/product/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-4" th:if="${totalPages > 0}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active' : ''">
                <a class="page-link" th:href="@{/product(page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>

    <hr class="my-4">
    <a href="/" class="btn btn-link">Quay về trang chủ</a>
</body>
</html>
