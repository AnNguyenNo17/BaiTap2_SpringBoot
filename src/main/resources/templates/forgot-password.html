<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-3">Quên mật khẩu</h2>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/forgot-password}" method="post" th:object="${forgotForm}" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Nhập email đã đăng ký</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Gửi mã OTP đặt lại mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
