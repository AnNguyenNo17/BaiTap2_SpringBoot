<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu</title>
</head>
<body>
    <h2>QUÊN MẬT KHẨU</h2>
    <p style="color: red;" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/forgot-password}" method="post">
        <label>Nhập Email đã đăng ký:</label><br>
        <input type="email" name="email" required /><br><br>
        <button type="submit">Gửi mã OTP đặt lại mật khẩu</button>
    </form>
</body>
</html>
