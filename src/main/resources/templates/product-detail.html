<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
</head>
<body>
    <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body">
            <h2 class="card-title" th:text="${product.name}"></h2>
            <p class="card-text">Giá: <strong th:text="${product.price}"></strong> VNĐ</p>
            <p class="card-text" th:text="${product.description}"></p>
            <a href="/" class="btn btn-link">Quay về trang chủ</a>
            <a href="/product" class="btn btn-link">Danh sách sản phẩm</a>
        </div>
    </div>
</body>
</html>
