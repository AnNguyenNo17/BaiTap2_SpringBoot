<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><sitemesh:write property='title'>Ứng dụng BaiTap2</sitemesh:write></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Cho phep tung trang noi dung chen them the <head> rieng (vd: meta, css rieng) -->
    <sitemesh:write property='head'></sitemesh:write>

    <style>
        body { background-color: #f7f8fa; }
        .navbar-brand { font-weight: 600; }
        main.container { padding-top: 24px; padding-bottom: 48px; min-height: 70vh; }
        footer { background-color: #212529; color: #adb5bd; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">BaiTap2 SpringBoot</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/product">Sản phẩm</a></li>
            </ul>
            <ul class="navbar-nav" th:if="${currentUser == null}">
                <li class="nav-item"><a class="nav-link" href="/login">Đăng nhập</a></li>
                <li class="nav-item"><a class="nav-link" href="/register">Đăng ký</a></li>
            </ul>
            <ul class="navbar-nav" th:if="${currentUser != null}">
                <li class="nav-item">
                    <a class="nav-link" href="/profile">
                        Xin chào, <span th:text="${currentUser.fullname != null and !currentUser.fullname.isEmpty()} ? ${currentUser.fullname} : ${currentUser.email}">User</span>
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/logout">Đăng xuất</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    <sitemesh:write property='body'></sitemesh:write>
</main>

<footer class="py-3 text-center">
    <small>&copy; 2026 - BaiTap2 SpringBoot (SiteMesh 3 + Bootstrap)</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
