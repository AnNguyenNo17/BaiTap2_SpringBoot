<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác minh OTP</title>
</head>
<body>
    <h2>XÁC MINH MÃ OTP</h2>
    <p style="color: red;" th:if="${error}" th:text="${error}"></p>
    
    <form th:action="@{/verify-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}" />
        <label>Mã OTP đã gửi về Email của bạn:</label><br>
        <input type="text" name="otp" required /><br><br>
        <button type="submit">Kích hoạt tài khoản</button>
    </form>
</body>
</html>
