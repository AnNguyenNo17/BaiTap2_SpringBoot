<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác minh OTP</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-3">Xác minh mã OTP</h2>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/verify-otp}" method="post" th:object="${otpForm}" novalidate>
                        <input type="hidden" th:field="*{email}" />
                        <div class="mb-3">
                            <label class="form-label">Mã OTP đã gửi về email của bạn</label>
                            <input type="text" th:field="*{otp}" class="form-control"
                                   th:classappend="${#fields.hasErrors('otp')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Kích hoạt tài khoản</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
