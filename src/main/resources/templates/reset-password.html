<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-3">Đặt lại mật khẩu</h2>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/reset-password}" method="post" th:object="${resetForm}" novalidate>
                        <input type="hidden" th:field="*{email}" />

                        <div class="mb-3">
                            <label class="form-label">Mã OTP trong email</label>
                            <input type="text" th:field="*{otp}" class="form-control"
                                   th:classappend="${#fields.hasErrors('otp')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" th:field="*{newPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Lưu mật khẩu mới</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
