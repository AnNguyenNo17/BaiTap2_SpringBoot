spring.application.name=btl2-admin-crud

# ============================================================
# DATABASE - mac dinh dung H2 (file-based) de chay ngay khong can cai dat.
# Neu muon dung MySQL, comment phan H2 lai va bo comment phan MySQL ben duoi,
# roi tao san database "btl2_admin_crud" trong MySQL.
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/btl2db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (bo comment de su dung) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/btl2_admin_crud?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# VIEW RESOLVER - JSP
# ============================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ============================================================
# UPLOAD
# ============================================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080
